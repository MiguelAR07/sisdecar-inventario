<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sisdecar Inventario</title>
<meta name="description" content="Demo de inventario y remisiones digitales para Sisdecar S.A.S.">
<link rel="icon" type="image/png" href="./logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><img id="logo-img" src="./logo.png" alt="Sisdecar, sistemas de carpado para volquetas" width="250" height="94"><small>Inventario y remisiones</small></div>
    <nav id="nav">
      <button data-nav="panel">Panel</button>
      <button data-nav="inventario">Inventario</button>
      <button data-nav="kits">Kit de carpado</button>
      <button data-nav="remisiones">Remisiones</button>
      <button data-nav="clientes">Clientes y vehículos</button>
    </nav>
    <button class="btn primary" data-nav="nueva">+ Nueva remisión</button>
    <div class="side-foot">
      <div class="side-contact"><b>Sisdecar S.A.S.</b>Cra. 52 # 117-15, Medellín<br>(604) 366 5931<br>comercial@sisdecar.com</div>
      <div class="demo-tag">Demo. Los productos vienen de sisdecar.com y del listado de piezas, y la remisión 51506 es la del talonario. Los clientes son los de la web, pero sus remisiones, precios y stock son de ejemplo.</div>
      <button class="btn sm ghost" id="reset">Restablecer datos del demo</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="layer"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
